<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pessoais</title>
    <link rel="stylesheet" href="financeiro.css">
  
</head>
<body>
    <header>
        <h1>Meu Controle Financeiro</h1>
    </header>

    <main class="container">
        <section class="resumo">
            <div class="card entrada">
                <h2>Entradas</h2>
                <p id="total-entradas">R$ 0,00</p>
            </div>
            <div class="card saida">
                <h2>Saidas</h2>
                <p id="total-saidas">R$ 0,00</p>

            
            </div>
        </div class="card total">
        <h2>Saldo Total</h2>
        <p id="Saldo Total">R$ 0,00</p>
    </div>
    </section>

    <section class="formulario">
        <h3>Nova Transacao</h3>
        <form id="form-transacao">
            <input type="text" id="descricao"placeholder="Descrição" required>
            <input type="number" id="valor" placeholder="Valor (R$)" step="0.01" required>
            <select id="tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>
            <button type="submit">Adicionar</button>
        </form>
    </section>

</section>
<h3>Historico de Lançamentos</h3>
<table>
    <thead>
        <tr>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Tipo</th>
        </tr>
    </thead>
    <tbody id="tabela-corpo">
        <tbody>
        </table>
</section>
</main>
</body>
</html>
